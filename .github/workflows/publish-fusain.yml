# SPDX-License-Identifier: Apache-2.0
name: Publish Fusain Package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/roastee

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/roastee/.tool-versions'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: '3.x'

      - name: Install dependencies
        run: task install

      - name: Run Fusain CI checks
        run: task fusain:ci

      - name: Build Fusain package
        run: task fusain:build

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter fusain publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run publish
        if: ${{ inputs.dry_run }}
        run: pnpm --filter fusain publish --dry-run --no-git-checks --access public
