#
# Bucket - Minimal HTTP server for serving experiment build outputs
# Target: Raspberry Pi Pico 2W (RP2350A with CYW43 WiFi)

# General kernel config
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_POSIX_API=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Shell (for WiFi configuration)
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_DEVICE_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# WiFi
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_CONNECTION_MANAGER=y

# DHCP server (for AP mode)
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_INF=y

# DHCP client (for STA mode)
CONFIG_NET_DHCPV4=y

# Static IP configuration (for AP mode)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Network shell for debugging
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_LOG=y

# HTTP Server
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=128

# WebSocket support (for Fusain endpoint)
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=4

# Fusain protocol library
CONFIG_FUSAIN=y

# GPIO (required for CYW43 WiFi chip)
CONFIG_GPIO=y

# Hardware info (for unique SSID generation)
CONFIG_HWINFO=y
CONFIG_HWINFO_RPI_PICO_CHIP_ID=y

# Poll support
CONFIG_ZVFS_POLL_MAX=32
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=8
